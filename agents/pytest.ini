[pytest]
# Eval suite configuration
testpaths = evals
python_files = eval_*.py test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    eval: marks test as an evaluation test
    live_only: marks test to run only with --live flag

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
